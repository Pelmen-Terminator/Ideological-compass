<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
<title>Идеологический Компас — Атлас идеологий v7.1</title>
<meta name="description" content="Справочник политических идеологий: 19 категорий, 141 идеология. Версия 7.1. ⚡ — радикальные, ⚠ — экстремистские идеологии. Сайт не пропагандирует идеологии.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,500;8..60,600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="frame">

  <!-- ============ САЙДБАР ============ -->
  <aside class="catalog" id="catalog">
    <div class="catalog-head">
      <span class="catalog-mark">☖</span>
      <div class="catalog-title">
        <h1>Идеологический Компас <span class="version-tag">v7.1</span></h1>
        <p>Справочник политических учений и их разновидностей</p>
      </div>
      <button class="catalog-toggle" id="catalogToggle" aria-label="Открыть/закрыть каталог">☰</button>
    </div>
    <nav class="catalog-list" id="catalogList"><!-- rendered by app.js --></nav>
    <div class="catalog-foot">
      <p>⚠ Сайт <strong>не пропагандирует</strong> идеологии. ⚡ радикальные, ⚠ экстремистские.</p>
    </div>
  </aside>

  <!-- ============ ОСНОВНОЙ КОНТЕНТ ============ -->
  <main class="reader" id="reader">
    <!-- rendered by app.js: welcome screen or ideology entry -->
  </main>

  <!-- ============ ОВЕРЛЕЙ ============ -->
  <div id="catalogOverlay"></div>

  <!-- ============ ПАНЕЛЬ НАСТРОЕК ============ -->
  <div class="settings-panel" id="settingsPanel">
    <div class="settings-header">
      <h3>⚙ Настройки</h3>
      <button class="settings-close" id="settingsClose" aria-label="Закрыть настройки">✕</button>
    </div>
    
    <div class="settings-group">
      <label for="viewportSelect">📱 Размер экрана</label>
      <select id="viewportSelect">
        <option value="auto">🔄 Авто (адаптивно)</option>
        <option value="phone">📱 Телефон</option>
        <option value="tablet">📱 Планшет</option>
        <option value="desktop">💻 Компьютер</option>
        <option value="tv">🖥 Телевизор</option>
      </select>
    </div>
    
    <div class="settings-group">
      <label for="fontSizeSelect">🔤 Размер шрифта</label>
      <select id="fontSizeSelect">
        <option value="small">Мелкий</option>
        <option value="medium" selected>Средний</option>
        <option value="large">Крупный</option>
        <option value="xlarge">Очень крупный</option>
      </select>
    </div>
    
    <div class="settings-group">
      <label for="themeSelect">🎨 Тема оформления</label>
      <select id="themeSelect">
        <option value="light">☀ Светлая</option>
        <option value="dark">🌙 Тёмная</option>
        <option value="sepia">📜 Сепия</option>
      </select>
    </div>
    
    <div class="settings-info">
      <span id="viewportInfo">🔄 Авто (адаптивно)</span>
      <span style="display:block;margin-top:4px;font-size:10px;color:var(--sidebar-dim);">
        Настройки сохраняются автоматически
      </span>
    </div>
  </div>

</div>

<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
